main:
  push:
    - stages:
        - name: test
          image: python:3.11
          jobs:
            - name: unit tests
              script: |
                python -m pip install --quiet --upgrade pip
                python -m unittest discover -s tests -v
            - name: e2e demo
              script: python examples/e2e_demo.py

  pull_request:
    - stages:
        - name: test
          image: python:3.11
          jobs:
            - name: unit tests
              script: python -m unittest discover -s tests -v
