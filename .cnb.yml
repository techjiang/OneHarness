main:
  push:
    - stages:
        - name: test
          image: python:3.11
          jobs:
            - name: unit tests
              script: |
                python -m pip install --quiet --upgrade pip
                python -m unittest discover -s tests -v
            - name: lint
              script: |
                python -m pip install --quiet ruff
                ruff check oneharness tests examples
                ruff format --check oneharness tests examples
            - name: demos
              script: |
                python examples/e2e_demo.py
                python examples/stream_demo.py
                python examples/mcp_demo.py
                python examples/mcp_health_demo.py
                python examples/delegate_demo.py
                python examples/fanout_demo.py
                python examples/bedrock_demo.py
                python examples/doctor_demo.py
                python examples/context_demo.py
                python examples/stream_tools_demo.py
                python examples/timing_demo.py
                python examples/network_demo.py
                python examples/network_kinds_demo.py
                python examples/tokens_demo.py
                python examples/cache_demo.py
                python examples/shell_demo.py
                python examples/trim_demo.py

  pull_request:
    - stages:
        - name: test
          image: python:3.11
          jobs:
            - name: unit tests
              script: python -m unittest discover -s tests -v
            - name: lint
              script: |
                python -m pip install --quiet ruff
                ruff check oneharness tests examples
                ruff format --check oneharness tests examples
            - name: demos
              script: |
                python examples/e2e_demo.py
                python examples/stream_demo.py
                python examples/mcp_demo.py
                python examples/mcp_health_demo.py
                python examples/delegate_demo.py
                python examples/fanout_demo.py
                python examples/bedrock_demo.py
                python examples/doctor_demo.py
                python examples/context_demo.py
                python examples/stream_tools_demo.py
                python examples/timing_demo.py
                python examples/network_demo.py
                python examples/network_kinds_demo.py
                python examples/tokens_demo.py
                python examples/cache_demo.py
                python examples/shell_demo.py
                python examples/trim_demo.py
