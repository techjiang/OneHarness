[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oneharness"
version = "0.5.0"
description = "A small, dependency-free harness for tool-calling LLM agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = [
  "llm",
  "agent",
  "tool-calling",
  "openai",
  "anthropic",
  "gemini",
  "bedrock",
  "azure",
  "mcp",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.5", "mypy>=1.10"]

[project.scripts]
oneharness = "oneharness.cli:main"

[tool.setuptools.packages.find]
include = ["oneharness*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["oneharness"]

[tool.coverage.run]
source = ["oneharness"]
